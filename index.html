<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Ensure window.fetch has both getter and setter so injected iframe scripts can safely assign/wrap fetch without throwing TypeError
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _origFetch; },
            set: function(fn) { _origFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphabet Safari - English Learning for Kids</title>
    <meta name="description" content="Kid-friendly English alphabet and phonics learning adventure from KG1 to Grade 2, featuring interactive pronunciation audio, spelling games, student profiles, and parental controls." />

    <meta property="og:description" content="Kid-friendly English alphabet and phonics learning adventure from KG1 to Grade 2, featuring interactive pronunciation audio, spelling games, student profiles, and parental controls." />
